name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  logic-linux:
    name: Logic tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v5
      - run: swift test

  ios:
    name: iOS build & simulator tests (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app 2>/dev/null || true
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Tests (SwiftPM + simulator)
        run: scripts/build.sh test
      - name: Simulator + unsigned arm64 device build
        run: scripts/build.sh device
      - name: Simulator screenshots
        run: scripts/build.sh screens
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: thicket-build
          path: |
            build/Thicket-unsigned.ipa
            build/test.log
            build/screens/*.png
          if-no-files-found: ignore
