name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  logic-linux:
    name: Logic tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v5
      - run: swift test

  ios:
    name: iOS build & simulator tests (macOS)
    runs-on: macos-15
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app 2>/dev/null || true
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Tests (SwiftPM + simulator)
        run: scripts/build.sh test
      - name: Simulator + unsigned arm64 device build
        run: scripts/build.sh device
      - name: Simulator screenshots
        run: scripts/build.sh screens
      - name: Publish screenshots to the ci-screenshots branch
        if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/shots
          for f in build/screens/*.png; do sips -Z 1000 "$f" --out "/tmp/shots/$(basename "$f")" >/dev/null; done
          cd /tmp/shots
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: thicket-build
          path: |
            build/Thicket-unsigned.ipa
            build/test.log
            build/screens/*.png
          if-no-files-found: ignore
